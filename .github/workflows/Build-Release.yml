name: Build-Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        default: ''

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: write gkd keystore
        run: echo ${{ secrets.GKD_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/gkd.jks

      - name: write play keystore
        run: echo ${{ secrets.PLAY_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/play.jks

      - run: ./gradlew :gkd-app:assembleGkdRelease :gkd-app:bundlePlayRelease
        env:
          GKD_STORE_FILE: ${{ github.workspace }}/gkd.jks
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
          PLAY_STORE_FILE: ${{ github.workspace }}/play.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: gkd-app/build/outputs/apk/gkd/release

      - uses: actions/upload-artifact@v7
        with:
          name: playRelease
          path: gkd-app/build/outputs/bundle/playRelease

      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: gkd-app/build/outputs

      - run: |
          cp outputs/apk/gkd/release/app-gkd-release.apk "${GITHUB_WORKSPACE}/gkd-${{ inputs.tag }}.apk"
          zip -r "${GITHUB_WORKSPACE}/outputs-${{ inputs.tag }}.zip" outputs
        working-directory: gkd-app/build

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          body_path: ./CHANGELOG.md
          prerelease: ${{ contains(inputs.tag, 'beta') }}
          fail_on_unmatched_files: true
          files: |
            gkd-*.apk
            outputs-*.zip
